<form id="contact-form" action="https://api.web3forms.com/submit" method="POST" novalidate>
  <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
  <input type="hidden" name="subject" id="mail-subject" value="WEB Contact - Vista Homes HOA">
  <input type="hidden" name="from_name" value="Vista Homes HOA Website">
  <input type="checkbox" name="botcheck" class="hp" style="display:none" tabindex="-1" autocomplete="off">

  <div class="row">
    <div>
      <label for="name">Full name</label>
      <input id="name" name="name" required maxlength="120">
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="160">
    </div>
  </div>
  <div class="row">
    <div>
      <label for="unit">Unit / address</label>
      <input id="unit" name="unit" maxlength="80" placeholder="e.g. 10-H">
    </div>
    <div>
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" maxlength="40">
    </div>
  </div>
  <label for="topic">Subject</label>
  <select id="topic" name="topic" required>
    <option value="">Select one</option>
    <option>General question</option>
    <option>Maintenance / work order</option>
    <option>Assessments / billing</option>
    <option>Architectural request</option>
    <option>Board meeting</option>
    <option>Other</option>
  </select>
  <label for="message">Message</label>
  <textarea id="message" name="message" required maxlength="4000" placeholder="How can we help?"></textarea>

  <div class="actions">
    <button class="btn btn-submit" type="submit" id="send-btn">Send message</button>
    <span style="color:var(--muted); font-size:0.9rem;">Typical reply during office hours.</span>
  </div>
  <div id="form-status" class="status" role="status" aria-live="polite"></div>
</form>

<script>
  const form = document.getElementById("contact-form");
  const status = document.getElementById("form-status");
  const button = document.getElementById("send-btn");
  const topic = document.getElementById("topic");
  const mailSubject = document.getElementById("mail-subject");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    status.className = "status";
    status.textContent = "";
    button.disabled = true;
    button.textContent = "Sending…";
    mailSubject.value = "WEB Contact - Vista Homes HOA : " + (topic.value || "Message");

    try {
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: new FormData(form)
      });
      const data = await response.json();
      if (!data.success) throw new Error(data.message || "Could not send your message.");
      form.reset();
      status.className = "status ok";
      status.textContent = "Thank you. Your message was sent to the association office.";
    } catch (err) {
      status.className = "status err";
      status.textContent = err.message || "Something went wrong. Please email directors@vistahomeshoa.net.";
    } finally {
      button.disabled = false;
      button.textContent = "Send message";
    }
  });
</script>
